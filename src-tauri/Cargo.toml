[package]
name = "iyagi-markdown-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "IYAGI Markdown — Tauri shell: 파일 IO·감시, 메뉴, 창, PDF 내보내기."

[lib]
name = "iyagi_markdown_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-dialog = "2.4.4"
tauri-plugin-opener = "2.7.0"
md-core = { workspace = true }
md-export = { workspace = true }
md-macos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
notify = { workspace = true }
libc = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-graphics = { workspace = true }
block2 = { workspace = true }
