# IYAGI Markdown CI — macOS 전용 앱이라 번들 job도 macOS뿐이다.
#
# - core-check(ubuntu): md-core·md-export는 OS 의존이 없어 리눅스 컨테이너에서
#   싸게 검증한다(usvg 시스템 폰트 로드는 macOS에서만 쓰인다).
# - macos-check(GitHub-hosted macos): fmt/clippy/test + 번들 없는 빌드. 서명·권한이
#   필요 없어 PR에서도 돈다.
# - bundle-macos(self-hosted, 보호 ref만): Developer ID 서명 DMG. iyagi-layout의
#   .github/workflows/ci.yml과 같은 보안 정책(self-hosted runner는 main/tag push에서만,
#   PR에서는 절대 실행하지 않음; 서버 측 설정이 실제 경계)을 따른다.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-check:
    runs-on: ubuntu-latest
    container: rust:1.89
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt -p md-core -p md-export --check
      - run: cargo test -p md-core -p md-export --locked

  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          key: macos-check-${{ github.ref }}-${{ hashFiles('Cargo.lock') }}
          path: |
            ~/.cargo/registry/
            target/
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run tauri build -- --no-bundle

  bundle-macos:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/release/bundle/dmg/
          retention-days: 7
