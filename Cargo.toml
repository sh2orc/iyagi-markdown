[workspace]
resolver = "2"
members = [
    "crates/md-core",
    "crates/md-export",
    "crates/md-macos",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["iyagi"]

[workspace.dependencies]
md-core = { path = "crates/md-core" }
md-export = { path = "crates/md-export" }
md-macos = { path = "crates/md-macos" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"

# macOS 바인딩 — Tauri 2.12가 쓰는 objc2 0.6 계열과 같은 세대를 고정한다.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"

# 파일 감시·내보내기
notify = "8"
comrak = "0.56"
usvg = "0.48"
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.dev]
debug = 1

[profile.release]
# 크기 우선(§1-2 ≤20MB 목표): 최적화 s + 단일 코드젠 유닛 + fat LTO.
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"
